<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laboratorio Pd · U-MA</title>
<meta name="description" content="Curso interactivo de Pure Data: 14 patches vivos que suenan en el navegador.">
<meta name="theme-color" content="#060708">
<meta property="og:type" content="website">
<meta property="og:title" content="Laboratorio Pd · U-MA">
<meta property="og:description" content="Pure Data, patches que suenan: mensajes, señal, síntesis, envolventes, secuencias, delays y tablas. ES · EN · DE · 日本 · 中文 · हिं">
<meta property="og:image" content="https://buenosairesfront.github.io/puredata/og.png">
<meta property="og:url" content="https://buenosairesfront.github.io/puredata/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Michroma&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="uma">
      <g stroke="#000" stroke-width="5" stroke-linejoin="miter" fill="#fff">
        <polygon points="34,20 22,32 22,150 34,138"/>
        <polygon points="22,150 236,150 248,138 34,138"/>
        <rect x="34" y="20" width="214" height="118"/>
      </g>
      <g fill="#000">
        <!-- U -->
        <rect x="50" y="30" width="11" height="62"/><rect x="80" y="30" width="11" height="62"/><rect x="50" y="81" width="41" height="11"/>
        <!-- - -->
        <rect x="99" y="56" width="26" height="11"/>
        <!-- M -->
        <rect x="133" y="30" width="11" height="62"/><rect x="183" y="30" width="11" height="62"/><rect x="133" y="30" width="61" height="11"/><rect x="158" y="30" width="11" height="44"/>
        <!-- A -->
        <polygon points="210,30 238,30 238,92 227,92 227,72 213,72 213,92 202,92 202,38"/>
      </g>
      <polygon points="213,41 227,41 227,61 213,61" fill="#fff"/>
      <rect x="34" y="100" width="214" height="5" fill="#000"/>
      <g stroke="#000" stroke-width="3">
        <rect x="44" y="111" width="22" height="20" fill="#ff2e97"/>
        <rect x="70" y="111" width="22" height="20" fill="#1fe2ff"/>
        <rect x="96" y="111" width="22" height="20" fill="#ffe04d"/>
        <rect x="126" y="110" width="114" height="22" fill="#fff"/>
      </g>
      <text x="183" y="127" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Kaku Gothic Pro','Yu Gothic',sans-serif" font-weight="700" font-size="15" fill="#000">サウンド</text>
    </g>
  </defs>
</svg>

<header class="hero">
  <div class="wrap hero-top"><div class="langs" data-langs role="group" aria-label="Idioma / Language"></div></div>
  <canvas id="heroCanvas" aria-hidden="true"></canvas>
  <div class="wrap">
    <div>
      <svg class="logo" viewBox="14 12 242 146" role="img" aria-label="U-MA サウンド"><use href="#uma"/></svg>
      <div class="kicker"><i style="background:var(--mag)"></i><i style="background:var(--cyan)"></i><i style="background:var(--yel)"></i> <span data-i18n="kicker"></span></div>
      <h1>Pure Data<span data-i18n="h1sub"></span></h1>
      <p class="lede" data-i18n="lede"></p>
      <div class="cta">
        <button class="btn primary" id="startBtn" data-i18n="start"></button>
        <a class="btn" href="#ref" data-i18n="cheat"></a>
      </div>
    </div>
    <div class="hero-side">
      <div class="stat-row">
        <div class="stat"><b>14</b><span data-i18n="statPatches"></span></div>
        <div class="stat"><b>44.1k</b><span data-i18n="statSr"></span></div>
        <div class="stat"><b>~</b><span data-i18n="statSig"></span></div>
      </div>
      <div class="codekey">
        <div><span class="sw y"></span><span data-i18n="keyYel"></span></div>
        <div><span class="sw c"></span><span data-i18n="keyCyan"></span></div>
        <div><span class="sw m"></span><span data-i18n="keyMag"></span></div>
        <div><span class="sw ln"></span><span data-i18n="keyGrey"></span></div>
      </div>
    </div>
  </div>
</header>

<div class="rail">
  <div class="wrap">
    <svg class="mini" viewBox="14 12 242 146" aria-hidden="true"><use href="#uma"/></svg>
    <nav id="nav"></nav>
    <div class="langs" data-langs role="group" aria-label="Idioma / Language"></div>
  </div>
</div>

<main id="main"></main>

<section class="ref wrap" id="ref">
  <h2 data-i18n="refTitle"></h2>
  <p style="color:var(--muted);max-width:60ch" data-i18n="refIntro"></p>
  <div class="ref-tools">
    <input id="refq" type="search" data-i18n-ph="refSearch" data-i18n-aria="refSearchAria">
    <div class="cats" id="cats"></div>
  </div>
  <div class="refgrid" id="refgrid"></div>
</section>

<section class="keys">
  <div class="wrap">
    <h2 data-i18n="keysTitle"></h2>
    <p style="color:var(--muted)" data-i18n="keysNote"></p>
    <div class="kgrid" id="keys"></div>
  </div>
</section>

<section class="next">
  <div class="wrap">
    <h2 data-i18n="nextTitle"></h2>
    <div class="ngrid" id="ncards"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <svg viewBox="14 12 242 146" aria-hidden="true"><use href="#uma"/></svg>
    <span data-i18n="footer"></span>
    <a href="https://github.com/buenosairesfront/puredata" target="_blank" rel="noopener">GitHub</a>
    <a href="https://www.instagram.com/buenos.aires.front/" target="_blank" rel="noopener">Buenos Aires Front</a>
  </div>
</footer>

<div class="dock" id="dock">
  <span class="st"><i></i><span id="dockTxt"></span></span>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" data-i18n-aria="volAria">
  <button id="panic" data-i18n="panic"></button>
</div>

<script src="js/i18n.js?v=3"></script>
</body>
</html>
